name: Build BREAK LAB 90

on:
  push:
    branches: [main]
    paths:
      - "vst.json"
      - "params.lock"
      - "presets.json"
      - "src/**"
      - "tests/**"
      - "vst/**"
      - "engine/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-armv7:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@7bf504d574180bbf1acb4ddd0db75dad2e298016
    with:
      tag: break-lab-90-v0.1.6
      version: "0.1.6"
      tools_ref: 7bf504d574180bbf1acb4ddd0db75dad2e298016
      vst_dir: .
      build: '"$MPC_VST/tools/build_port.sh" vst.json armv7'
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json && bash tests/run_engine_smoke.sh'
      extra: engine/breaks:engine/breaks
      user_data: engine
      about: "Breakbeat sampler for first-generation MPC hardware; ARMv7/armhf build with 16 MIDI slices, WAV playback and vintage processing."
      plugin_id: break-lab-90
      dry_run: true
