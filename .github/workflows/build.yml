name: Build BREAK LAB 90

on:
  push:
    branches: [main]
    paths:
      - "vst.json"
      - "params.lock"
      - "src/**"
      - "tests/**"
      - "vst/**"
      - "engine/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-armv7:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@11d340572dcc93778f341a9484c5ae6c51126abe
    with:
      tag: break-lab-90-v0.1.3
      version: "0.1.3"
      tools_ref: 11d340572dcc93778f341a9484c5ae6c51126abe
      vst_dir: .
      build: '"$MPC_VST/tools/build_port.sh" vst.json armv7'
      host_test: '"$MPC_VST/tools/test_port.sh" vst.json && bash tests/run_engine_smoke.sh'
      extra: engine/breaks:engine/breaks
      user_data: engine
      about: "Breakbeat sampler prototype for MPC Live Gen1; includes direct WAV and MIDI slice smoke tests."
      dry_run: true
